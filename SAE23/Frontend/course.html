<!doctype html>
<html lang="fr">

<head>

<body>
    <nav class="navbar navbar-expand-lg mb-4" style="background-color: #7286dd;" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand text-white fw-semibold" href="#" id="edition">Vendée Globe 2020-2021</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active text-white" aria-current="page" href="skipper.html">Skipper</a>

                    <li class="nav-item">

                    </li>
                    <li class="nav-item">
                        <a class="nav-link active text-white" aria-current="page" href="course.html">Courses</a>

                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                    <button class="btn btn-light text-primary fw-semibold" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row align-items-start gap-4 gap-lg-0">

            <div class="col-12 col-lg-8">
                <table class="table table-striped table-hover" id="classement">
                    <thead>
                        <tr>
                            <th scope="col">Rang</th>
                            <th scope="col">Skipper</th>
                            <th scope="col">Bateau</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>

            <div class="col-12 col-lg-4">
                <div class="card">
                    <div class="card-header">
                        Liste des éditions
                    </div>
                    <div class="card-body d-flex flex-wrap gap-2" id="tbouton">
                        <button type="button" class="btn btn-outline-primary"
                            onclick="classement('42')">2020-2021</button>
                        <button type="button" class="btn btn-outline-primary"
                            onclick="classement('3')">2016-2017</button>
                        <button type="button" class="btn btn-outline-primary"
                            onclick="classement('10')">2012-2013</button>
                        <button type="button" class="btn btn-outline-primary"
                            onclick="classement('16')">2008-2009</button>
                        <button type="button" class="btn btn-outline-primary"
                            onclick="classement('24')">2004-2005</button>
                        <button type="button" class="btn btn-outline-primary"
                            onclick="classement('29')">2000-2001</button>
                        <button type="button" class="btn btn-outline-primary"
                            onclick="classement('33')">1996-1997</button>
                        <button type="button" class="btn btn-outline-primary"
                            onclick="classement('36')">1992-1993</button>
                        <button type="button" class="btn btn-outline-primary"
                            onclick="classement('44')">1989-1990</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
